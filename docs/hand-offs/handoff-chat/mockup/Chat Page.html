<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Konseling.org — Chat Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="chat-styles.css"/>
<style>
  html, body { background: #efedf5; min-height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="chat-shell.jsx"></script>
<script type="text/babel" src="chat-screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas
      title="Chat Page — Konseling.org"
      subtitle="6 state berbeda dari flow ngobrol dengan Kawan AI. Klik artboard untuk fokus, ←/→ untuk pindah, Esc untuk keluar."
    >
      <DCSection id="onboarding" title="Onboarding (Sebelum Chat)">
        <DCArtboard id="mood" label="1 · Mood Check-in" width={1280} height={820}>
          <MoodScreen/>
        </DCArtboard>
        <DCArtboard id="disclaimer" label="2 · Disclaimer Singkat" width={1280} height={820}>
          <DisclaimerScreen/>
        </DCArtboard>
      </DCSection>

      <DCSection id="chat" title="Chat dengan Kawan">
        <DCArtboard id="empty" label="3 · Sapaan Pertama" width={1280} height={820}>
          <EmptyChatScreen/>
        </DCArtboard>
        <DCArtboard id="mid" label="4 · Mid Conversation" width={1280} height={820}>
          <MidChatScreen/>
        </DCArtboard>
      </DCSection>

      <DCSection id="crisis" title="Crisis Detection">
        <DCArtboard id="crisis-l3" label="5 · Level 3 — Risiko Tinggi (Soft Banner)" width={1280} height={820}>
          <CrisisBannerScreen/>
        </DCArtboard>
        <DCArtboard id="crisis-l4" label="6 · Level 4 — Suicidal (Full Takeover)" width={1280} height={820}>
          <CrisisTakeoverScreen/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
